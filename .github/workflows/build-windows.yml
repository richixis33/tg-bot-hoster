name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc

    - name: Build Release Binary
      run: cargo build --release

    - name: Prepare Artifact Package
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item target/release/tg-bot-hoster.exe dist/TeleHost.exe
        Copy-Item start_telehost.bat dist/
        Copy-Item telehost_server.py dist/
        Copy-Item README.md dist/
        Copy-Item ui dist/ui -Recurse
        Copy-Item examples dist/examples -Recurse
        Compress-Archive -Path dist/* -DestinationPath dist/TeleHost-Windows-x64.zip

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleHost-Windows-x64
        path: dist/

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: TeleHost v1.0.0 (Release)
        draft: false
        prerelease: false
        files: |
          dist/TeleHost.exe
          dist/TeleHost-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
