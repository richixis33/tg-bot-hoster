name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      working-directory: android
      run: chmod +x gradlew

    - name: Build Android Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Rename APK for release
      working-directory: android
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TeleHost.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleHost-Android-APK
        path: android/app/build/outputs/apk/debug/TeleHost.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: TeleHost v1.0.0 (Release)
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/debug/TeleHost.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
